[project]
name = "closer-ai"
version = "0.1.0"
description = "AI Closer — Sales Intelligence for high-ticket sales operations"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.17.2",  # pinned: rule defaults change between versions (local and CI must match)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit, not left to version defaults: naive datetimes are rejected outside the
# tests that exercise exactly that (marked `# noqa: DTZ001`).
extend-select = ["DTZ001"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
